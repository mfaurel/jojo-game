// ── Canvas2D adapter matching Phaser 4 Graphics API ──────────────────────────

function makeG(ctx) {
    let _fill  = [255, 255, 255, 1];
    let _stroke= [255, 255, 255, 1];
    let _lw    = 1;

    const hexToRgb = h => [(h >> 16) & 0xff, (h >> 8) & 0xff, h & 0xff];
    const rgba = ([r,g,b], a) => `rgba(${r},${g},${b},${a})`;

    return {
        fillStyle(hex, alpha = 1) {
            _fill = [...hexToRgb(hex), alpha];
            ctx.fillStyle = rgba(_fill, alpha);
        },
        lineStyle(w, hex, alpha = 1) {
            _lw = w;
            _stroke = [...hexToRgb(hex), alpha];
            ctx.strokeStyle = rgba(_stroke, alpha);
            ctx.lineWidth   = w;
        },
        fillCircle(x, y, r) {
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
        },
        fillRect(x, y, w, h) {
            ctx.fillRect(x, y, w, h);
        },
        fillEllipse(cx, cy, w, h) {
            ctx.beginPath();
            ctx.ellipse(cx, cy, w / 2, h / 2, 0, 0, Math.PI * 2);
            ctx.fill();
        },
        fillTriangle(x1, y1, x2, y2, x3, y3) {
            ctx.beginPath();
            ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3);
            ctx.closePath(); ctx.fill();
        },
        fillRoundedRect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.arcTo(x + w, y, x + w, y + r, r);
            ctx.lineTo(x + w, y + h - r);
            ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
            ctx.lineTo(x + r, y + h);
            ctx.arcTo(x, y + h, x, y + h - r, r);
            ctx.lineTo(x, y + r);
            ctx.arcTo(x, y, x + r, y, r);
            ctx.closePath(); ctx.fill();
        },
        lineBetween(x1, y1, x2, y2) {
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        },
        beginPath() { ctx.beginPath(); },
        moveTo(x, y) { ctx.moveTo(x, y); },
        lineTo(x, y) { ctx.lineTo(x, y); },
        arc(x, y, r, start, end, cw = false) { ctx.arc(x, y, r, start, end, cw); },
        strokePath() { ctx.stroke(); },
        fillPath() { ctx.fill(); },
        closePath() { ctx.closePath(); },
        strokeCircle(x, y, r) {
            ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
        },
        strokeRoundedRect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.arcTo(x + w, y, x + w, y + r, r);
            ctx.lineTo(x + w, y + h - r);
            ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
            ctx.lineTo(x + r, y + h);
            ctx.arcTo(x, y + h, x, y + h - r, r);
            ctx.lineTo(x, y + r);
            ctx.arcTo(x, y, x + r, y, r);
            ctx.closePath(); ctx.stroke();
        },
    };
}

// ── Kawaii designs ────────────────────────────────────────────────────────────

function drawKawaii(g, name) {
    // Helper: draw a kawaii eye at (cx,cy) with given sclera/iris/pupil radii and iris color
    function kawaiiEye(cx, cy, rs, ri, rp, irisColor) {
        g.fillStyle(0xffffff, 1); g.fillCircle(cx, cy, rs);
        g.fillStyle(irisColor, 1); g.fillCircle(cx, cy, ri);
        g.fillStyle(0x111111, 1); g.fillCircle(cx, cy, rp);
        g.fillStyle(0xffffff, 1); g.fillCircle(cx - rp*0.35, cy - rp*0.35, Math.max(2, rp*0.4));
    }
    // Helper: cute smile arc
    function smile(cx, cy, r, a1, a2) {
        g.lineStyle(3, 0x333333, 1);
        g.beginPath(); g.arc(cx, cy, r, a1, a2, false); g.strokePath();
    }

    if (name === 'monster_snowman') {
        // Body
        g.fillStyle(0xeeeeee, 1); g.fillCircle(0, 50, 60);
        g.fillStyle(0xffffff, 1); g.fillCircle(0, 50, 52);
        // Head
        g.fillStyle(0xeeeeee, 1); g.fillCircle(0, -30, 50);
        g.fillStyle(0xffffff, 1); g.fillCircle(0, -30, 44);
        // Hat brim
        g.fillStyle(0x222233, 1); g.fillRect(-18, -82, 36, 9);
        // Hat top
        g.fillStyle(0x222233, 1); g.fillRect(-11, -96, 22, 16);
        // Scarf
        g.fillStyle(0xff4444, 1); g.fillRect(-46, 8, 92, 13);
        g.fillStyle(0xdd2222, 1); g.fillRect(-46, 19, 18, 7); // knot drape

const SIZE = 200;
const OFFSET_Y = 20; // slight downward offset to center visually

function makeCanvas(drawFn, bgColor) {
    const canvas = document.createElement('canvas');
    canvas.width  = SIZE;
    canvas.height = SIZE;
    canvas.style.background = bgColor;
    const ctx = canvas.getContext('2d');
    ctx.save();
    ctx.translate(SIZE / 2, SIZE / 2 + OFFSET_Y);
    const g = makeG(ctx);
    drawFn(g);
    ctx.restore();
    return canvas;
}

WORLDS.forEach(world => {
    const section = document.createElement('div');
    section.className = 'world';

    const title = document.createElement('div');
    title.className = 'world-title';
    title.style.background = world.bg;
    title.textContent = world.name;
    section.appendChild(title);

    const row = document.createElement('div');
    row.className = 'monsters';

    world.monsters.forEach(mName => {
        const card = document.createElement('div');
        card.className = 'card';

        const nameEl = document.createElement('div');
        nameEl.className = 'card-name';
        nameEl.textContent = LABELS[mName] ?? mName;
        card.appendChild(nameEl);

        const variants = document.createElement('div');
        variants.className = 'variants';

        // Detailed variant
        const detailedWrap = document.createElement('div');
        detailedWrap.className = 'variant';
        const detailedCanvas = makeCanvas(g => drawDetailed(g, mName), world.bg);
        const detailedLabel = document.createElement('div');
        detailedLabel.className = 'variant-label detailed';
        detailedLabel.textContent = 'Détaillé';
        detailedWrap.appendChild(detailedCanvas);
        detailedWrap.appendChild(detailedLabel);

        // Kawaii variant
        const kawaiiWrap = document.createElement('div');
        kawaiiWrap.className = 'variant';
        const kawaiiCanvas = makeCanvas(g => drawKawaii(g, mName), world.bg);
        const kawaiiLabel = document.createElement('div');
        kawaiiLabel.className = 'variant-label kawaii';
        kawaiiLabel.textContent = 'Kawaii';
        kawaiiWrap.appendChild(kawaiiCanvas);
        kawaiiWrap.appendChild(kawaiiLabel);

        variants.appendChild(detailedWrap);
        variants.appendChild(kawaiiWrap);
        card.appendChild(variants);
        row.appendChild(card);
    });

    section.appendChild(row);
    document.body.appendChild(section);
});

function wordDraw_MIEL_v2(gfx, cx, cy, r) {
            // Honeycomb grid pattern — hexagonal cells
            gfx.fillStyle(0xfff8e0, 1); gfx.fillCircle(cx, cy, r*0.95);
            // Draw hexagonal honeycomb cells
            const hexR = r * 0.2;
            const rows = [
                [{x:cx-r*0.4,y:cy-r*0.44},{x:cx,y:cy-r*0.44},{x:cx+r*0.4,y:cy-r*0.44}],
                [{x:cx-r*0.6,y:cy-r*0.1},{x:cx-r*0.2,y:cy-r*0.1},{x:cx+r*0.2,y:cy-r*0.1},{x:cx+r*0.6,y:cy-r*0.1}],
                [{x:cx-r*0.4,y:cy+r*0.24},{x:cx,y:cy+r*0.24},{x:cx+r*0.4,y:cy+r*0.24}],
                [{x:cx-r*0.2,y:cy+r*0.58},{x:cx+r*0.2,y:cy+r*0.58}],
            ];
            rows.forEach(row => row.forEach(({x,y}) => {
                gfx.fillStyle(0xffaa00, 1);
                gfx.beginPath();
                for(let i=0;i<6;i++){
                    const a = i*Math.PI/3 - Math.PI/6;
                    if(i===0) gfx.moveTo(x+Math.cos(a)*hexR, y+Math.sin(a)*hexR);
                    else gfx.lineTo(x+Math.cos(a)*hexR, y+Math.sin(a)*hexR);
                }
                gfx.closePath(); gfx.fillPath();
                gfx.fillStyle(0xffcc33, 0.7);
                gfx.beginPath();
                for(let i=0;i<6;i++){
                    const a = i*Math.PI/3 - Math.PI/6;
                    if(i===0) gfx.moveTo(x+Math.cos(a)*hexR*0.72, y+Math.sin(a)*hexR*0.72);
                    else gfx.lineTo(x+Math.cos(a)*hexR*0.72, y+Math.sin(a)*hexR*0.72);
                }
                gfx.closePath(); gfx.fillPath();
                gfx.lineStyle(1.5, 0xcc7700, 0.6);
                gfx.beginPath();
                for(let i=0;i<6;i++){
                    const a = i*Math.PI/3 - Math.PI/6;
                    if(i===0) gfx.moveTo(x+Math.cos(a)*hexR, y+Math.sin(a)*hexR);
                    else gfx.lineTo(x+Math.cos(a)*hexR, y+Math.sin(a)*hexR);
                }
                gfx.closePath(); gfx.strokePath();
            }));
        }

// Render words section
const WORD_SIZE = 120;

function makeWordCanvas(drawFn, bgColor) {
    const canvas = document.createElement('canvas');
    canvas.width  = WORD_SIZE;
    canvas.height = WORD_SIZE;
    canvas.style.background = bgColor;
    const ctx = canvas.getContext('2d');
    ctx.save();
    const g = makeG(ctx);
    drawFn(g, WORD_SIZE / 2, WORD_SIZE / 2, WORD_SIZE * 0.4);
    ctx.restore();
    return canvas;
}

const wordSection = document.createElement('div');
wordSection.className = 'world';
wordSection.style.maxWidth = '1200px';

const wordTitle = document.createElement('div');
wordTitle.className = 'world-title';
wordTitle.style.background = '#1a3a1a';
wordTitle.textContent = 'Mots / Word Icons';
wordSection.appendChild(wordTitle);

const wordSubtitle = document.createElement('p');
wordSubtitle.className = 'subtitle';
wordSubtitle.textContent = 'Chaque mot : Version 1 (drawPicture) + Version 2 (drawPicture2) — 120x120 px';
wordSubtitle.style.marginBottom = '12px';
wordSection.appendChild(wordSubtitle);

const wordRow = document.createElement('div');
wordRow.className = 'monsters';
wordRow.style.gap = '14px';

WORD_ICONS.forEach(({ key, draw1, draw2 }) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.padding = '8px 10px 7px';

    const nameEl = document.createElement('div');
    nameEl.className = 'card-name';
    nameEl.style.fontSize = '0.82em';
    nameEl.textContent = key;
    card.appendChild(nameEl);

    const variants = document.createElement('div');
    variants.className = 'variants';

    // Version 1
    const v1Wrap = document.createElement('div');
    v1Wrap.className = 'variant';
    const c1 = makeWordCanvas(draw1, '#1a1a2e');
    const l1 = document.createElement('div');
    l1.className = 'variant-label detailed';
    l1.textContent = 'V1';
    v1Wrap.appendChild(c1);
    v1Wrap.appendChild(l1);

    // Version 2
    const v2Wrap = document.createElement('div');
    v2Wrap.className = 'variant';
    const c2 = makeWordCanvas(draw2, '#1a1a2e');
    const l2 = document.createElement('div');
    l2.className = 'variant-label kawaii';
    l2.textContent = 'V2';
    v2Wrap.appendChild(c2);
    v2Wrap.appendChild(l2);

    variants.appendChild(v1Wrap);
    variants.appendChild(v2Wrap);
    card.appendChild(variants);
    wordRow.appendChild(card);
});

wordSection.appendChild(wordRow);
document.body.appendChild(wordSection);
