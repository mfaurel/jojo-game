// ── Canvas2D adapter matching Phaser 4 Graphics API ──────────────────────────

function makeG(ctx) {
    let _fill  = [255, 255, 255, 1];
    let _stroke= [255, 255, 255, 1];
    let _lw    = 1;

    const hexToRgb = h => [(h >> 16) & 0xff, (h >> 8) & 0xff, h & 0xff];
    const rgba = ([r,g,b], a) => `rgba(${r},${g},${b},${a})`;

    return {
        fillStyle(hex, alpha = 1) {
            _fill = [...hexToRgb(hex), alpha];
            ctx.fillStyle = rgba(_fill, alpha);
        },
        lineStyle(w, hex, alpha = 1) {
            _lw = w;
            _stroke = [...hexToRgb(hex), alpha];
            ctx.strokeStyle = rgba(_stroke, alpha);
            ctx.lineWidth   = w;
        },
        fillCircle(x, y, r) {
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
        },
        fillRect(x, y, w, h) {
            ctx.fillRect(x, y, w, h);
        },
        fillEllipse(cx, cy, w, h) {
            ctx.beginPath();
            ctx.ellipse(cx, cy, w / 2, h / 2, 0, 0, Math.PI * 2);
            ctx.fill();
        },
        fillTriangle(x1, y1, x2, y2, x3, y3) {
            ctx.beginPath();
            ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3);
            ctx.closePath(); ctx.fill();
        },
        fillRoundedRect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.arcTo(x + w, y, x + w, y + r, r);
            ctx.lineTo(x + w, y + h - r);
            ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
            ctx.lineTo(x + r, y + h);
            ctx.arcTo(x, y + h, x, y + h - r, r);
            ctx.lineTo(x, y + r);
            ctx.arcTo(x, y, x + r, y, r);
            ctx.closePath(); ctx.fill();
        },
        lineBetween(x1, y1, x2, y2) {
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        },
        beginPath() { ctx.beginPath(); },
        moveTo(x, y) { ctx.moveTo(x, y); },
        lineTo(x, y) { ctx.lineTo(x, y); },
        arc(x, y, r, start, end, cw = false) { ctx.arc(x, y, r, start, end, cw); },
        strokePath() { ctx.stroke(); },
        fillPath() { ctx.fill(); },
        closePath() { ctx.closePath(); },
    };
}

// ── Kawaii designs ────────────────────────────────────────────────────────────

function drawKawaii(g, name) {
    // Helper: draw a kawaii eye at (cx,cy) with given sclera/iris/pupil radii and iris color
    function kawaiiEye(cx, cy, rs, ri, rp, irisColor) {
        g.fillStyle(0xffffff, 1); g.fillCircle(cx, cy, rs);
        g.fillStyle(irisColor, 1); g.fillCircle(cx, cy, ri);
        g.fillStyle(0x111111, 1); g.fillCircle(cx, cy, rp);
        g.fillStyle(0xffffff, 1); g.fillCircle(cx - rp*0.35, cy - rp*0.35, Math.max(2, rp*0.4));
    }
    // Helper: cute smile arc
    function smile(cx, cy, r, a1, a2) {
        g.lineStyle(3, 0x333333, 1);
        g.beginPath(); g.arc(cx, cy, r, a1, a2, false); g.strokePath();
    }

    if (name === 'monster_snowman') {
        // Body
        g.fillStyle(0xeeeeee, 1); g.fillCircle(0, 50, 60);
        g.fillStyle(0xffffff, 1); g.fillCircle(0, 50, 52);
        // Head
        g.fillStyle(0xeeeeee, 1); g.fillCircle(0, -30, 50);
        g.fillStyle(0xffffff, 1); g.fillCircle(0, -30, 44);
        // Hat brim
        g.fillStyle(0x222233, 1); g.fillRect(-18, -82, 36, 9);
        // Hat top
        g.fillStyle(0x222233, 1); g.fillRect(-11, -96, 22, 16);
        // Scarf
        g.fillStyle(0xff4444, 1); g.fillRect(-46, 8, 92, 13);
        g.fillStyle(0xdd2222, 1); g.fillRect(-46, 19, 18, 7); // knot drape
        // Eyes
        kawaiiEye(-18, -42, 14, 9, 5, 0x222233);
        kawaiiEye(18, -42, 14, 9, 5, 0x222233);
        // Carrot nose
        g.fillStyle(0xff8800, 1); g.fillTriangle(0, -33, 0, -27, 20, -30);
        // Smile
        smile(0, -22, 12, 0.2, Math.PI - 0.2);
        // Buttons
        g.fillStyle(0x333344, 1); g.fillCircle(0, 28, 5); g.fillCircle(0, 45, 5); g.fillCircle(0, 60, 5);

    } else if (name === 'monster_ice_golem') {
        // Main body
        g.fillStyle(0x5baad5, 1); g.fillRoundedRect(-55, -80, 110, 165, 20);
        // Front panel

    monster_ladybug:    'Coccinelle',
    monster_dragon:     'Dragon',
    monster_lava_golem: 'Golem de lave',
    monster_phoenix:    'Phénix',
    monster_shark:      'Requin',
    monster_octopus:    'Poulpe',
    monster_jellyfish:  'Méduse',
    monster_alien:      'Alien',
    monster_robot:      'Robot',
    monster_ufo:        'OVNI',
};

const SIZE = 200;
const OFFSET_Y = 20; // slight downward offset to center visually

function makeCanvas(drawFn, bgColor) {
    const canvas = document.createElement('canvas');
    canvas.width  = SIZE;
    canvas.height = SIZE;
    canvas.style.background = bgColor;
    const ctx = canvas.getContext('2d');
    ctx.save();
    ctx.translate(SIZE / 2, SIZE / 2 + OFFSET_Y);
    const g = makeG(ctx);
    drawFn(g);
    ctx.restore();
    return canvas;
}

WORLDS.forEach(world => {
    const section = document.createElement('div');
    section.className = 'world';

    const title = document.createElement('div');
    title.className = 'world-title';
    title.style.background = world.bg;
    title.textContent = world.name;
    section.appendChild(title);

    const row = document.createElement('div');
    row.className = 'monsters';

    world.monsters.forEach(mName => {
        const card = document.createElement('div');
        card.className = 'card';

        const nameEl = document.createElement('div');
        nameEl.className = 'card-name';
        nameEl.textContent = LABELS[mName] ?? mName;
        card.appendChild(nameEl);

        const variants = document.createElement('div');
        variants.className = 'variants';

        // Detailed variant
        const detailedWrap = document.createElement('div');
        detailedWrap.className = 'variant';
        const detailedCanvas = makeCanvas(g => drawDetailed(g, mName), world.bg);
        const detailedLabel = document.createElement('div');
        detailedLabel.className = 'variant-label detailed';
        detailedLabel.textContent = 'Détaillé';
        detailedWrap.appendChild(detailedCanvas);
        detailedWrap.appendChild(detailedLabel);

        // Kawaii variant
        const kawaiiWrap = document.createElement('div');
        kawaiiWrap.className = 'variant';
        const kawaiiCanvas = makeCanvas(g => drawKawaii(g, mName), world.bg);
        const kawaiiLabel = document.createElement('div');
        kawaiiLabel.className = 'variant-label kawaii';
        kawaiiLabel.textContent = 'Kawaii';
        kawaiiWrap.appendChild(kawaiiCanvas);
        kawaiiWrap.appendChild(kawaiiLabel);

        variants.appendChild(detailedWrap);
        variants.appendChild(kawaiiWrap);
        card.appendChild(variants);
        row.appendChild(card);
    });

    section.appendChild(row);
    document.body.appendChild(section);
});
</script>
</body>
</html>
