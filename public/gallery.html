<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galerie — Monstres Mathématiques</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0a1a; color: #fff; font-family: 'Arial Black', Arial, sans-serif; }
  h1 { text-align: center; padding: 24px 0 12px; font-size: 2em; color: #ffd700;
       text-shadow: 0 0 18px #ff8800; letter-spacing: 2px; }
  .world { margin: 24px auto; max-width: 860px; padding: 0 16px; }
  .world-title { display: flex; align-items: center; gap: 10px; font-size: 1.4em;
                 margin-bottom: 16px; padding: 8px 16px; border-radius: 10px; }
  .monsters { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
  .card { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  canvas { border-radius: 12px; display: block; }
  .monster-name { font-size: 0.95em; color: #ddd; text-align: center; }
</style>
</head>
<body>
<h1>🎮 Galerie des Monstres</h1>

<script>
// ── Canvas2D adapter matching Phaser 4 Graphics API ──────────────────────────

function makeG(ctx) {
    let _fill  = [255, 255, 255, 1];
    let _stroke= [255, 255, 255, 1];
    let _lw    = 1;

    const hexToRgb = h => [(h >> 16) & 0xff, (h >> 8) & 0xff, h & 0xff];
    const rgba = ([r,g,b], a) => `rgba(${r},${g},${b},${a})`;

    return {
        fillStyle(hex, alpha = 1) {
            _fill = [...hexToRgb(hex), alpha];
            ctx.fillStyle = rgba(_fill, alpha);
        },
        lineStyle(w, hex, alpha = 1) {
            _lw = w;
            _stroke = [...hexToRgb(hex), alpha];
            ctx.strokeStyle = rgba(_stroke, alpha);
            ctx.lineWidth   = w;
        },
        fillCircle(x, y, r) {
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
        },
        fillRect(x, y, w, h) {
            ctx.fillRect(x, y, w, h);
        },
        fillEllipse(cx, cy, w, h) {
            ctx.beginPath();
            ctx.ellipse(cx, cy, w / 2, h / 2, 0, 0, Math.PI * 2);
            ctx.fill();
        },
        fillTriangle(x1, y1, x2, y2, x3, y3) {
            ctx.beginPath();
            ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3);
            ctx.closePath(); ctx.fill();
        },
        fillRoundedRect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.arcTo(x + w, y, x + w, y + r, r);
            ctx.lineTo(x + w, y + h - r);
            ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
            ctx.lineTo(x + r, y + h);
            ctx.arcTo(x, y + h, x, y + h - r, r);
            ctx.lineTo(x, y + r);
            ctx.arcTo(x, y, x + r, y, r);
            ctx.closePath(); ctx.fill();
        },
        lineBetween(x1, y1, x2, y2) {
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        },
        beginPath() { ctx.beginPath(); },
        moveTo(x, y) { ctx.moveTo(x, y); },
        lineTo(x, y) { ctx.lineTo(x, y); },
        arc(x, y, r, start, end, cw = false) { ctx.arc(x, y, r, start, end, cw); },
        strokePath() { ctx.stroke(); },
    };
}

// ── Monster drawing (ported from MathDungeon._drawDetailedMonster) ────────────

function drawMonster(g, name) {
    if (name === 'monster_snowman') {
        g.fillStyle(0xe0e0e0, 1); g.fillCircle(0, 50, 70); g.fillCircle(0, -30, 50);
        g.fillStyle(0xffffff, 1); g.fillCircle(-10, 40, 60); g.fillCircle(-8, -35, 42);
        g.fillStyle(0xd35400, 1); g.fillTriangle(0, -35, 0, -25, 40, -30);
        g.fillStyle(0x2c3e50, 1); g.fillCircle(-15, -45, 6); g.fillCircle(15, -45, 6);
    } else if (name === 'monster_ice_golem') {
        g.fillStyle(0x2980b9, 1); g.fillRect(-70, -100, 140, 200);
        g.fillStyle(0x3498db, 1); g.fillRect(-60, -90, 120, 180);
        g.fillStyle(0x00ffff, 1); g.fillRect(-45, -70, 25, 25); g.fillRect(20, -70, 25, 25);
        g.lineStyle(2, 0xffffff, 0.5); g.lineBetween(-30, 10, 20, 50); g.lineBetween(40, -20, 60, 20);
    } else if (name === 'monster_polar_bear') {
        g.fillStyle(0xdcdde1, 1); g.fillEllipse(0, 0, 160, 110); g.fillCircle(90, -40, 50);
        g.fillStyle(0xffffff, 1); g.fillEllipse(-10, -5, 140, 90);
        g.fillStyle(0x2f3640, 1); g.fillCircle(115, -45, 6); g.fillCircle(130, -35, 10);
    } else if (name === 'monster_lollipop') {
        g.fillStyle(0xffffff, 1); g.fillRect(-7, 0, 14, 120);
        g.fillStyle(0xff4444, 1); for (let i=0;i<5;i++) g.fillRect(-7, i*24, 14, 12);
        g.fillStyle(0xff69b4, 1); g.fillCircle(0, -60, 70);
        g.lineStyle(7, 0xffffff, 0.8); g.beginPath();
        for (let a=0;a<Math.PI*2.5;a+=0.15) {
            const r=a*9, px=Math.cos(a)*r, py=Math.sin(a)*r-60;
            if (a===0) g.moveTo(px,py); else g.lineTo(px,py);
        }
        g.strokePath();
        g.fillStyle(0x2c3e50, 1); g.fillCircle(-22,-72,7); g.fillCircle(22,-72,7);
        g.lineStyle(5,0x2c3e50,1); g.beginPath(); g.arc(0,-55,18,0.2,Math.PI-0.2,false); g.strokePath();
    } else if (name === 'monster_teddy') {
        g.fillStyle(0xff6644, 1); g.fillEllipse(0,30,110,130); g.fillCircle(0,-50,55);
        g.fillStyle(0xff9977, 0.5); g.fillCircle(-18,-65,20);
        g.fillStyle(0xff6644, 1); g.fillCircle(-38,-95,18); g.fillCircle(38,-95,18);
        g.fillStyle(0x2c3e50, 1); g.fillCircle(-18,-55,7); g.fillCircle(18,-55,7);
        g.fillStyle(0xffffff, 1); g.fillCircle(-20,-57,3); g.fillCircle(16,-57,3);
        g.lineStyle(4,0x2c3e50,1); g.beginPath(); g.arc(0,-40,16,0.2,Math.PI-0.2,false); g.strokePath();
    } else if (name === 'monster_candy_cane') {
        g.fillStyle(0xffffff, 1); g.fillRect(-18,-60,36,160);
        g.fillStyle(0xdd1111, 1); for (let i=0;i<6;i++) g.fillRect(-18,-60+i*27,36,13);
        g.fillStyle(0xffffff, 1); g.fillRect(-18,-88,70,30); g.fillRect(34,-88,36,60);
        g.fillStyle(0xdd1111, 1); g.fillRect(-18,-88,70,13); g.fillRect(34,-88,36,13); g.fillRect(34,-62,36,13);
        g.fillStyle(0x2c3e50, 1); g.fillCircle(-6,40,5); g.fillCircle(6,40,5);
        g.lineStyle(4,0x2c3e50,1); g.beginPath(); g.arc(0,55,10,0.2,Math.PI-0.2,false); g.strokePath();
    } else if (name === 'monster_bee') {
        g.fillStyle(0xffd700,1); g.fillEllipse(0,20,80,120);
        g.fillStyle(0x1a1a1a,1); g.fillRect(-40,0,80,18); g.fillRect(-40,36,80,18); g.fillRect(-40,72,80,18);
        g.fillStyle(0xaaddff,0.55); g.fillEllipse(-65,-30,80,50); g.fillEllipse(65,-30,80,50);
        g.fillStyle(0xffd700,1); g.fillCircle(0,-55,38);
        g.fillStyle(0x1a1a1a,1); g.fillCircle(-13,-60,7); g.fillCircle(13,-60,7);
        g.lineStyle(3,0x1a1a1a,1); g.lineBetween(-10,-90,-25,-118); g.lineBetween(10,-90,25,-118);
        g.fillStyle(0x1a1a1a,1); g.fillCircle(-25,-118,5); g.fillCircle(25,-118,5);
        g.lineStyle(3,0x1a1a1a,1); g.beginPath(); g.arc(0,-46,13,0.2,Math.PI-0.2,false); g.strokePath();
    } else if (name === 'monster_butterfly') {
        g.fillStyle(0x8833ff,1); g.fillTriangle(-95,-65,-10,-55,-10,60); g.fillTriangle(95,-65,10,-55,10,60);
        g.fillStyle(0xbb88ff,1); g.fillTriangle(-70,65,-10,10,-10,115); g.fillTriangle(70,65,10,10,10,115);
        g.lineStyle(2,0xffffff,0.45); g.lineBetween(-55,-40,-20,20); g.lineBetween(55,-40,20,20);
        g.fillStyle(0x1a1a1a,1); g.fillEllipse(0,20,16,120); g.fillCircle(0,-50,18);
        g.lineStyle(3,0x1a1a1a,1); g.lineBetween(-5,-65,-20,-100); g.lineBetween(5,-65,20,-100);
        g.fillStyle(0x8833ff,1); g.fillCircle(-20,-100,6); g.fillCircle(20,-100,6);
    } else if (name === 'monster_ladybug') {
        g.fillStyle(0xdd1111,1); g.fillEllipse(0,10,140,120);
        g.lineStyle(4,0x1a1a1a,1); g.lineBetween(0,-50,0,70);
        g.fillStyle(0x1a1a1a,1);
        g.fillCircle(-34,-12,16); g.fillCircle(34,-12,16);
        g.fillCircle(-32,28,13); g.fillCircle(32,28,13);
        g.fillCircle(-20,58,10); g.fillCircle(20,58,10);
        g.fillStyle(0x1a1a1a,1); g.fillCircle(0,-62,36);
        g.fillStyle(0xffffff,1); g.fillCircle(-12,-68,9); g.fillCircle(12,-68,9);
        g.fillStyle(0x1a1a1a,1); g.fillCircle(-12,-68,5); g.fillCircle(12,-68,5);
        g.lineStyle(3,0x1a1a1a,1); g.lineBetween(-8,-94,-20,-122); g.lineBetween(8,-94,20,-122);
    } else if (name === 'monster_dragon') {
        g.fillStyle(0x440000,1); g.fillTriangle(-20,-20,-130,-100,-80,60); g.fillTriangle(20,-20,130,-100,80,60);
        g.fillStyle(0x660000,1); g.fillEllipse(0,40,120,140);
        g.fillStyle(0x880000,1); g.fillEllipse(-8,30,95,115);
        g.fillStyle(0x770000,1); g.fillRect(-16,-80,32,70);
        g.fillStyle(0x990000,1); g.fillEllipse(0,-100,60,48);
        g.fillStyle(0x660000,1); g.fillRect(0,-108,42,18);
        g.fillStyle(0xff6600,0.9); g.fillTriangle(42,-104,60,-114,105,-96); g.fillTriangle(42,-100,58,-90,108,-108);
        g.fillStyle(0xffcc00,0.8); g.fillTriangle(48,-102,62,-100,96,-100);
        g.fillStyle(0xffff00,1); g.fillCircle(-12,-100,8);
        g.fillStyle(0x000000,1); g.fillCircle(-12,-100,4);
    } else if (name === 'monster_lava_golem') {
        g.fillStyle(0x2d1a1a,1); g.fillRect(-70,-100,140,200);
        g.fillStyle(0x4a2010,1); g.fillRect(-60,-90,120,180);
        g.lineStyle(4,0xff6600,0.9); g.lineBetween(-30,-60,10,-20); g.lineBetween(-10,-20,-35,25); g.lineBetween(-35,25,20,65); g.lineBetween(-50,35,-5,70);
        g.lineStyle(2,0xffaa00,0.6); g.lineBetween(-22,-52,6,-14); g.lineBetween(-4,-14,-26,20);
        g.fillStyle(0xff4400,1); g.fillRect(-35,-72,22,18); g.fillRect(13,-72,22,18);
        g.fillStyle(0xffaa00,0.7); g.fillRect(-29,-68,12,10); g.fillRect(17,-68,12,10);
    } else if (name === 'monster_phoenix') {
        g.fillStyle(0xff2200,1); g.fillTriangle(-18,68,2,28,22,78);
        g.fillStyle(0xff6600,1); g.fillTriangle(-28,72,-4,38,6,82);
        g.fillStyle(0xffaa00,1); g.fillTriangle(12,70,22,38,36,75);
        g.fillStyle(0xcc2200,1); g.fillTriangle(-15,-20,-115,-80,-90,55); g.fillTriangle(15,-20,115,-80,90,55);
        g.fillStyle(0xff6600,1); g.fillTriangle(-15,-20,-88,-58,-72,40); g.fillTriangle(15,-20,88,-58,72,40);
        g.fillStyle(0xdd4400,1); g.fillEllipse(0,14,78,105);
        g.fillStyle(0xff6600,1); g.fillEllipse(-6,6,58,80);
        g.fillStyle(0xff5500,1); g.fillCircle(0,-54,34);
        g.fillStyle(0xffcc00,1); g.fillTriangle(-6,-84,0,-112,6,-84); g.fillTriangle(-16,-80,-8,-106,0,-80); g.fillTriangle(6,-80,14,-106,16,-80);
        g.fillStyle(0xffee00,1); g.fillCircle(-11,-57,7);
        g.fillStyle(0x000000,1); g.fillCircle(-11,-57,3);
        g.fillStyle(0xffcc00,1); g.fillTriangle(6,-54,26,-50,6,-44);
    } else if (name === 'monster_shark') {
        g.fillStyle(0x5b7d8a,1); g.fillEllipse(0,0,180,78);
        g.fillStyle(0x7ab0c0,1); g.fillEllipse(-8,-6,148,58);
        g.fillStyle(0xddeeff,1); g.fillEllipse(5,16,115,28);
        g.fillStyle(0x4a6a77,1);
        g.fillTriangle(-8,-38,18,-38,8,-110); g.fillTriangle(-50,8,-92,58,-18,48); g.fillTriangle(50,8,92,48,18,48);
        g.fillTriangle(-80,-6,-115,-52,-115,42);
        g.fillStyle(0x000000,1); g.fillCircle(52,-16,8);
        g.fillStyle(0xffffff,1); g.fillCircle(54,-18,3);
        g.fillStyle(0xffffff,1); for (let i=0;i<5;i++) g.fillTriangle(-18+i*12,4,-10+i*12,4,-14+i*12,22);
    } else if (name === 'monster_octopus') {
        g.fillStyle(0x5533aa,1);
        g.fillRoundedRect(-58,5,22,95,11); g.fillRoundedRect(-28,10,20,100,10);
        g.fillRoundedRect(8,10,20,100,10); g.fillRoundedRect(36,5,22,95,11);
        g.fillStyle(0xaa88ff,1);
        for (let i=0;i<4;i++) { g.fillCircle(-47,22+i*20,5); g.fillCircle(-18,28+i*20,5); g.fillCircle(18,28+i*20,5); g.fillCircle(47,22+i*20,5); }
        g.fillStyle(0x5533aa,1); g.fillEllipse(0,-42,125,105);
        g.fillStyle(0x7755cc,1); g.fillEllipse(-8,-48,92,78);
        g.fillStyle(0xffeedd,1); g.fillCircle(-20,-52,15); g.fillCircle(20,-52,15);
        g.fillStyle(0x1a0044,1); g.fillCircle(-20,-52,7); g.fillCircle(20,-52,7);
        g.fillStyle(0xffffff,1); g.fillCircle(-22,-54,3); g.fillCircle(18,-54,3);
    } else if (name === 'monster_jellyfish') {
        g.lineStyle(3,0xaabbff,0.5);
        g.lineBetween(-42,0,-62,105); g.lineBetween(-58,-8,-75,92); g.lineBetween(42,0,62,105); g.lineBetween(58,-8,75,92);
        g.lineStyle(8,0x7788ee,0.7);
        g.lineBetween(-14,2,-24,82); g.lineBetween(2,2,10,86); g.lineBetween(16,2,6,78);
        g.fillStyle(0x5588ff,0.8); g.fillEllipse(0,-42,140,100);
        g.fillStyle(0x88aaff,0.6); g.fillEllipse(-5,-50,100,65);
        g.fillStyle(0xccddff,0.85); g.fillCircle(-25,-52,7); g.fillCircle(16,-56,5); g.fillCircle(32,-44,6); g.fillCircle(-8,-36,4);
    } else if (name === 'monster_alien') {
        g.fillStyle(0x44bb44,1); g.fillEllipse(0,-52,114,134);
        g.fillStyle(0x66dd66,1); g.fillEllipse(-8,-60,82,100);
        g.fillStyle(0x0a0a1a,1); g.fillEllipse(-22,-58,40,28); g.fillEllipse(22,-58,40,28);
        g.fillStyle(0x3333ff,0.5); g.fillCircle(-22,-58,12); g.fillCircle(22,-58,12);
        g.lineStyle(3,0x228822,1); g.lineBetween(-14,-22,14,-22);
        g.fillStyle(0x44bb44,1); g.fillRect(-20,18,40,58); g.fillRect(-54,22,34,12); g.fillRect(20,22,34,12);
        g.lineStyle(3,0x44bb44,1); g.lineBetween(-14,-112,-28,-148); g.lineBetween(14,-112,28,-148);
        g.fillStyle(0x88ff88,1); g.fillCircle(-28,-148,7); g.fillCircle(28,-148,7);
    } else if (name === 'monster_robot') {
        g.fillStyle(0x667788,1); g.fillRect(-38,-112,76,68);
        g.fillStyle(0x001122,1); g.fillRect(-28,-102,56,32);
        g.fillStyle(0x00ffff,1); g.fillRect(-20,-94,16,15); g.fillRect(4,-94,16,15);
        g.fillStyle(0x889999,1); g.fillRect(-3,-144,6,34); g.fillCircle(0,-147,7);
        g.fillStyle(0xff4444,1); g.fillCircle(0,-147,4);
        g.fillStyle(0x556677,1); g.fillRect(-55,-44,110,118);
        g.fillStyle(0x445566,1); g.fillRect(-38,-34,76,80);
        g.fillStyle(0xff4444,1); g.fillCircle(-18,-14,6);
        g.fillStyle(0x44ff44,1); g.fillCircle(0,-14,6);
        g.fillStyle(0x4444ff,1); g.fillCircle(18,-14,6);
        g.fillStyle(0x667788,1); g.fillRect(-86,-40,31,80); g.fillRect(55,-40,31,80); g.fillCircle(-70,46,16); g.fillCircle(70,46,16);
        g.fillStyle(0x556677,1); g.fillRect(-40,74,30,50); g.fillRect(10,74,30,50); g.fillRect(-48,118,46,18); g.fillRect(2,118,46,18);
    } else if (name === 'monster_ufo') {
        g.fillStyle(0xffffaa,0.14); g.fillTriangle(-50,22,50,22,105,210);
        g.fillStyle(0xaabbcc,1); g.fillEllipse(0,12,200,60);
        g.fillStyle(0xbbccdd,1); g.fillEllipse(-4,6,158,44);
        g.fillStyle(0x4488cc,0.75); g.fillEllipse(0,-26,82,72);
        g.fillStyle(0x66aaee,0.5); g.fillEllipse(-7,-32,50,46);
        const rimColors=[0xff4444,0x44ff44,0x4488ff,0xffff44,0xff44ff];
        for (let i=0;i<5;i++) {
            const a=(i/5)*Math.PI*2;
            g.fillStyle(rimColors[i],1); g.fillCircle(Math.cos(a)*75,Math.sin(a)*20+12,7);
        }
        g.fillStyle(0x44bb44,0.85); g.fillCircle(0,-26,18);
        g.fillStyle(0x0a0a1a,1); g.fillEllipse(-7,-28,14,9); g.fillEllipse(7,-28,14,9);
    }
}

// ── World definitions ─────────────────────────────────────────────────────────

const WORLDS = [
    { name: 'Toundra ❄️',    bg: '#1a3a5a', monsters: ['monster_snowman','monster_ice_golem','monster_polar_bear'] },
    { name: 'Sucré 🍭',      bg: '#cc6699', monsters: ['monster_lollipop','monster_teddy','monster_candy_cane'] },
    { name: 'Prairie 🌸',    bg: '#2a7a2a', monsters: ['monster_bee','monster_butterfly','monster_ladybug'] },
    { name: 'Volcan 🌋',     bg: '#440800', monsters: ['monster_dragon','monster_lava_golem','monster_phoenix'] },
    { name: 'Océan 🌊',      bg: '#002244', monsters: ['monster_shark','monster_octopus','monster_jellyfish'] },
    { name: 'Espace 🚀',     bg: '#110022', monsters: ['monster_alien','monster_robot','monster_ufo'] },
];

const LABELS = {
    monster_snowman:   'Bonhomme de neige',
    monster_ice_golem: 'Golem de glace',
    monster_polar_bear:'Ours polaire',
    monster_lollipop:  'Sucette',
    monster_teddy:     'Nounours',
    monster_candy_cane:'Canne en sucre',
    monster_bee:       'Abeille',
    monster_butterfly: 'Papillon',
    monster_ladybug:   'Coccinelle',
    monster_dragon:    'Dragon',
    monster_lava_golem:'Golem de lave',
    monster_phoenix:   'Phénix',
    monster_shark:     'Requin',
    monster_octopus:   'Poulpe',
    monster_jellyfish: 'Méduse',
    monster_alien:     'Alien',
    monster_robot:     'Robot',
    monster_ufo:       'OVNI',
};

const SIZE = 220;

WORLDS.forEach(world => {
    const section = document.createElement('div');
    section.className = 'world';

    const title = document.createElement('div');
    title.className = 'world-title';
    title.style.background = world.bg;
    title.textContent = world.name;
    section.appendChild(title);

    const row = document.createElement('div');
    row.className = 'monsters';

    world.monsters.forEach(mName => {
        const card = document.createElement('div');
        card.className = 'card';

        const canvas = document.createElement('canvas');
        canvas.width  = SIZE;
        canvas.height = SIZE;
        canvas.style.background = world.bg;

        const ctx = canvas.getContext('2d');
        ctx.save();
        ctx.translate(SIZE / 2, SIZE / 2 + 20); // centre + slight downward offset
        const g = makeG(ctx);
        drawMonster(g, mName);
        ctx.restore();

        const label = document.createElement('div');
        label.className = 'monster-name';
        label.textContent = LABELS[mName] ?? mName;

        card.appendChild(canvas);
        card.appendChild(label);
        row.appendChild(card);
    });

    section.appendChild(row);
    document.body.appendChild(section);
});
</script>
</body>
</html>
