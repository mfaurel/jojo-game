<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Château de Jolyne — Asset Gallery</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    padding: 24px;
  }
  h1 {
    text-align: center;
    font-size: 2rem;
    color: #f5c518;
    margin-bottom: 8px;
    text-shadow: 0 2px 8px rgba(245,197,24,0.4);
  }
  .subtitle {
    text-align: center;
    font-size: 0.9rem;
    color: #8888aa;
    margin-bottom: 32px;
  }
  h2 {
    font-size: 1.4rem;
    color: #88aaff;
    margin: 32px 0 16px 0;
    padding-bottom: 8px;
    border-bottom: 1px solid #334;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 16px;
    max-width: 1200px;
  }
  .cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #16213e;
    border-radius: 10px;
    padding: 10px 6px 8px;
    border: 1px solid #2a2a4a;
    transition: border-color 0.2s, transform 0.1s;
    cursor: default;
  }
  .cell:hover {
    border-color: #f5c518;
    transform: translateY(-2px);
  }
  .cell canvas {
    border-radius: 6px;
    display: block;
  }
  .label {
    margin-top: 8px;
    font-size: 0.75rem;
    color: #ccccee;
    text-align: center;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .sublabel {
    font-size: 0.62rem;
    color: #6666aa;
    margin-top: 2px;
  }
  .error-msg {
    font-size: 0.65rem;
    color: #ff6655;
    margin-top: 4px;
    text-align: center;
  }
  .section { margin-bottom: 48px; }
  .monster-world { margin-bottom: 32px; }
  .monster-world-title {
    display: flex; align-items: center; gap: 10px;
    font-size: 1.1em; margin-bottom: 12px; padding: 6px 14px;
    border-radius: 8px; font-weight: 700;
  }
  .monster-row { display: flex; gap: 20px; flex-wrap: wrap; }
  .monster-card { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .monster-card canvas { border-radius: 10px; display: block; }
  .monster-label { font-size: 0.8rem; color: #ccccee; text-align: center; font-weight: 600; }
  #status {
    text-align: center;
    color: #8888aa;
    font-size: 0.85rem;
    margin-bottom: 16px;
    min-height: 20px;
  }
</style>

<!--
  Importmap: redirect WordData's I18n.js import to a thin stub
  so that the gallery works without the full service layer.
  This uses the resolved absolute path on the server.
-->
<script type="importmap">
{
  "imports": {
    "/src/game/data/I18n.js": "/docs/gallery-i18n-stub.js",
    "/src/game/services/NameService.js": "/docs/gallery-nameservice-stub.js"
  }
}
</script>

</head>
<body>

<h1>Le Château de Jolyne — Asset Gallery</h1>
<p class="subtitle">Aperçu de tous les sprites dessinés via <code>drawPicture()</code></p>
<p id="status">Chargement…</p>

<div class="section">
  <h2>Mots (Words) — <span id="word-count">0</span> sprites</h2>
  <div class="grid" id="word-grid"></div>
</div>

<div class="section">
  <h2>Objets (Items) — <span id="item-count">0</span> éléments</h2>
  <div class="grid" id="item-grid"></div>
</div>

<div class="section">
  <h2>Monstres Mathématiques — 6 mondes × 3 monstres</h2>
  <div id="monster-sections"></div>
</div>

<script type="module">
// ─── Canvas 2D context wrapper implementing the Phaser Graphics subset ─────

function makeGfx(ctx) {
  // Convert a 0xRRGGBB integer to CSS rgba string
  function hexToRgba(hex, alpha) {
    const r = (hex >> 16) & 0xff;
    const g = (hex >> 8)  & 0xff;
    const b =  hex        & 0xff;
    return `rgba(${r},${g},${b},${alpha ?? 1})`;
  }

  let fillColor = 'rgba(255,255,255,1)';
  let strokeColor = 'rgba(0,0,0,1)';
  let strokeW = 1;

  return {
    // ── Phaser-style style setters ──────────────────────────────────────
    fillStyle(color, alpha) {
      fillColor = hexToRgba(color, alpha ?? 1);
      ctx.fillStyle = fillColor;
    },
    lineStyle(width, color, alpha) {
      strokeW = width;
      strokeColor = hexToRgba(color, alpha ?? 1);
      ctx.strokeStyle = strokeColor;
      ctx.lineWidth = width;
    },

    // ── Fill shapes ─────────────────────────────────────────────────────
    fillRect(x, y, w, h) {
      ctx.fillStyle = fillColor;
      ctx.fillRect(x, y, w, h);
    },
    fillRoundedRect(x, y, w, h, radius) {
      ctx.fillStyle = fillColor;
      const r = Math.min(typeof radius === 'number' ? radius : 0, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
      ctx.fill();
    },
    fillCircle(x, y, radius) {
      ctx.fillStyle = fillColor;
      ctx.beginPath();
      ctx.arc(x, y, Math.max(0, radius), 0, Math.PI * 2);
      ctx.fill();
    },
    fillEllipse(x, y, width, height) {
      ctx.fillStyle = fillColor;
      ctx.beginPath();
      ctx.ellipse(x, y, Math.max(0, width / 2), Math.max(0, height / 2), 0, 0, Math.PI * 2);
      ctx.fill();
    },
    fillTriangle(x1, y1, x2, y2, x3, y3) {
      ctx.fillStyle = fillColor;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.lineTo(x3, y3);
      ctx.closePath();
      ctx.fill();
    },

    // ── Stroke shapes ───────────────────────────────────────────────────
    strokeRect(x, y, w, h) {
      ctx.strokeStyle = strokeColor;
      ctx.lineWidth = strokeW;
      ctx.strokeRect(x, y, w, h);
    },
    strokeRoundedRect(x, y, w, h, radius) {
      ctx.strokeStyle = strokeColor;
      ctx.lineWidth = strokeW;
      const r = Math.min(typeof radius === 'number' ? radius : 0, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
      ctx.stroke();
    },
    strokeCircle(x, y, radius) {
      ctx.strokeStyle = strokeColor;
      ctx.lineWidth = strokeW;
      ctx.beginPath();
      ctx.arc(x, y, Math.max(0, radius), 0, Math.PI * 2);
      ctx.stroke();
    },

    // ── Path API (mirrors Phaser's path drawing) ─────────────────────────
    beginPath() { ctx.beginPath(); },
    closePath() { ctx.closePath(); },
    moveTo(x, y) { ctx.moveTo(x, y); },
    lineTo(x, y) { ctx.lineTo(x, y); },
    arc(x, y, radius, startAngle, endAngle, anticlockwise) {
      ctx.arc(x, y, Math.max(0, radius), startAngle, endAngle, anticlockwise);
    },
    fillPath() {
      ctx.fillStyle = fillColor;
      ctx.fill();
    },
    strokePath() {
      ctx.strokeStyle = strokeColor;
      ctx.lineWidth = strokeW;
      ctx.stroke();
    },
    lineBetween(x1, y1, x2, y2) {
      ctx.strokeStyle = strokeColor;
      ctx.lineWidth = strokeW;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    },
  };
}

// ─── Cell renderer ──────────────────────────────────────────────────────────

const SIZE = 100;
const RADIUS = SIZE / 2;
const CX = SIZE / 2;
const CY = SIZE / 2;

function renderCell(parent, label, sublabel, drawFn) {
  const cell = document.createElement('div');
  cell.className = 'cell';

  const canvas = document.createElement('canvas');
  canvas.width  = SIZE;
  canvas.height = SIZE;
  cell.appendChild(canvas);

  const ctx = canvas.getContext('2d');
  const gfx = makeGfx(ctx);

  // Clip to circle
  ctx.save();
  ctx.beginPath();
  ctx.arc(CX, CY, RADIUS - 1, 0, Math.PI * 2);
  ctx.clip();

  try {
    drawFn(gfx, CX, CY, RADIUS - 4);
  } catch (err) {
    // Fallback: show error tile
    ctx.fillStyle = '#2a0022';
    ctx.fillRect(0, 0, SIZE, SIZE);
    ctx.fillStyle = '#ff4444';
    ctx.font = '10px monospace';
    ctx.fillText('ERR', 32, 52);
    const errEl = document.createElement('div');
    errEl.className = 'error-msg';
    errEl.textContent = err.message?.slice(0, 28);
    cell.appendChild(errEl);
  }
  ctx.restore();

  const lbl = document.createElement('div');
  lbl.className = 'label';
  lbl.textContent = label;
  cell.appendChild(lbl);

  if (sublabel) {
    const sub = document.createElement('div');
    sub.className = 'sublabel';
    sub.textContent = sublabel;
    cell.appendChild(sub);
  }

  parent.appendChild(cell);
}

// ─── Items without drawPicture — render an emoji or placeholder ─────────────

function renderItemCell(parent, item) {
  const cell = document.createElement('div');
  cell.className = 'cell';

  const canvas = document.createElement('canvas');
  canvas.width  = SIZE;
  canvas.height = SIZE;
  cell.appendChild(canvas);

  const ctx = canvas.getContext('2d');

  // Background gradient
  ctx.save();
  ctx.beginPath();
  ctx.arc(CX, CY, RADIUS - 1, 0, Math.PI * 2);
  ctx.clip();

  const rarityColors = {
    COMMON:    ['#2a2a3e', '#44446e'],
    UNCOMMON:  ['#1a2a1a', '#2a5a2a'],
    RARE:      ['#1a1a3a', '#2a2a8a'],
    EPIC:      ['#2a1a3a', '#6a2a9a'],
    LEGENDARY: ['#3a2010', '#9a5a10'],
  };
  const [c1, c2] = rarityColors[item.rarity] ?? ['#222', '#444'];
  const grad = ctx.createRadialGradient(CX, CY, 0, CX, CY, RADIUS);
  grad.addColorStop(0, c2);
  grad.addColorStop(1, c1);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, SIZE, SIZE);

  // Emoji or category icon
  if (item.emoji) {
    ctx.font = '36px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(item.emoji, CX, CY);
  } else {
    // Show category abbreviation
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(item.category?.toUpperCase() ?? '?', CX, CY);
  }

  ctx.restore();

  // Rarity dot
  const rarityDotColors = {
    COMMON: '#ffffff', UNCOMMON: '#1eff00', RARE: '#0070dd',
    EPIC: '#a335ee', LEGENDARY: '#ff8000'
  };
  const dotCtx = canvas.getContext('2d');
  dotCtx.beginPath();
  dotCtx.arc(SIZE - 10, 10, 4, 0, Math.PI * 2);
  dotCtx.fillStyle = rarityDotColors[item.rarity] ?? '#888';
  dotCtx.fill();

  const lbl = document.createElement('div');
  lbl.className = 'label';
  lbl.textContent = item.id.replace(/^(item_[LR]_|skin_|bg_|card_)/, '');
  cell.appendChild(lbl);

  const sub = document.createElement('div');
  sub.className = 'sublabel';
  sub.textContent = item.rarity.toLowerCase();
  cell.appendChild(sub);

  parent.appendChild(cell);
}

// ─── Main ────────────────────────────────────────────────────────────────────

const statusEl  = document.getElementById('status');
const wordGrid  = document.getElementById('word-grid');
const itemGrid  = document.getElementById('item-grid');
const wordCount = document.getElementById('word-count');
const itemCount = document.getElementById('item-count');

const WORD_KEYS = [
  'ROI','CHAT','TOUR','OURS','LUNE',
  'COQ','OIE','LION','LOUP','CERF',
  'EAU','BOIS','MONT','VENT','CIEL',
  'PAIN','LAIT','NOIX','MIEL','OEUF',
  'VELO','AUTO','BAIN','FOUR','VASE',
  'PAPA','MAMAN','BEBE','TATA','PAPI',
  'BLEU','ROSE','NOIR','VERT','GRIS',
  'NEZ','BRAS','MAIN','PIED','TETE',
  'KIWI','POIRE','POMME','FIGUE','PRUNE',
  'VACHE','LAPIN','POULE','CHIEN','PONEY',
];

try {
  statusEl.textContent = 'Import des modules de données…';

  // Dynamic import — works when served (GitHub Pages / local dev server).
  // Will fail on raw file:// due to CORS; in that case we fall back to
  // the inline-data path below.
  const { getWord }  = await import('../src/game/data/WordData.js');
  const { ITEMS }    = await import('../src/game/data/ItemData.js');

  // ── Words ──────────────────────────────────────────────────────────────
  let rendered = 0;
  for (const key of WORD_KEYS) {
    const word = getWord(key);
    if (!word) continue;
    const frLabel = word.answer || key;
    renderCell(wordGrid, frLabel, key !== frLabel ? key : null, word.drawPicture.bind(word));
    rendered++;
  }
  wordCount.textContent = rendered;

  // ── Items ──────────────────────────────────────────────────────────────
  for (const item of ITEMS) {
    renderItemCell(itemGrid, item);
  }
  itemCount.textContent = ITEMS.length;

  statusEl.textContent = `✓ ${rendered} sprites de mots + ${ITEMS.length} objets rendus.`;
  statusEl.style.color = '#44cc88';

} catch (err) {
  console.error('Gallery load error:', err);
  statusEl.innerHTML = `
    <span style="color:#ff6655">
      Impossible de charger les modules.
      Servez le projet localement (<code>npm run dev</code> ou GitHub Pages).<br>
      Erreur : ${err.message}
    </span>`;

  // ── Graceful fallback ──────────────────────────────────────────────────
  // Render placeholder tiles so the page is not completely empty.
  for (const key of WORD_KEYS) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = SIZE;
    const ctx = canvas.getContext('2d');
    const hue = (WORD_KEYS.indexOf(key) / WORD_KEYS.length) * 360;
    ctx.fillStyle = `hsl(${hue},40%,25%)`;
    ctx.beginPath();
    ctx.arc(CX, CY, RADIUS - 1, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = `hsl(${hue},60%,65%)`;
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(key, CX, CY);
    cell.appendChild(canvas);
    const lbl = document.createElement('div');
    lbl.className = 'label';
    lbl.textContent = key;
    cell.appendChild(lbl);
    wordGrid.appendChild(cell);
  }
  wordCount.textContent = `${WORD_KEYS.length} (fallback)`;
}
</script>

<script>
// ── Math Monster Gallery ──────────────────────────────────────────────────────
// Self-contained — does not require the ES module import to succeed.

(function renderMonsters() {
  const SIZE = 200;
  const container = document.getElementById('monster-sections');
  if (!container) return;

  function makeMonsterGfx(ctx) {
    function hexToRgba(hex, alpha) {
      return 'rgba(' + ((hex >> 16) & 0xff) + ',' + ((hex >> 8) & 0xff) + ',' + (hex & 0xff) + ',' + (alpha ?? 1) + ')';
    }
    let fc = 'rgba(255,255,255,1)', sc = 'rgba(0,0,0,1)', lw = 1;
    return {
      fillStyle(h, a)  { fc = hexToRgba(h, a); ctx.fillStyle = fc; },
      lineStyle(w, h, a) { lw = w; sc = hexToRgba(h, a); ctx.strokeStyle = sc; ctx.lineWidth = w; },
      fillCircle(x, y, r)  { ctx.fillStyle = fc; ctx.beginPath(); ctx.arc(x, y, Math.max(0,r), 0, Math.PI*2); ctx.fill(); },
      fillRect(x, y, w, h) { ctx.fillStyle = fc; ctx.fillRect(x, y, w, h); },
      fillEllipse(x, y, w, h) { ctx.fillStyle = fc; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0,w/2), Math.max(0,h/2), 0, 0, Math.PI*2); ctx.fill(); },
      fillTriangle(x1,y1,x2,y2,x3,y3) { ctx.fillStyle = fc; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.lineTo(x3,y3); ctx.closePath(); ctx.fill(); },
      fillRoundedRect(x, y, w, h, r) {
        ctx.fillStyle = fc; ctx.beginPath();
        ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
        ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
        ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
        ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath(); ctx.fill();
      },
      lineBetween(x1,y1,x2,y2) { ctx.strokeStyle = sc; ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); },
      beginPath() { ctx.beginPath(); },
      moveTo(x,y) { ctx.moveTo(x,y); },
      lineTo(x,y) { ctx.lineTo(x,y); },
      arc(x,y,r,s,e,cw) { ctx.arc(x,y,Math.max(0,r),s,e,cw); },
      strokePath() { ctx.strokeStyle = sc; ctx.lineWidth = lw; ctx.stroke(); },
    };
  }

  function drawMonster(g, name) {
    if (name === 'monster_snowman') {
      g.fillStyle(0xe0e0e0,1); g.fillCircle(0,50,70); g.fillCircle(0,-30,50);
      g.fillStyle(0xffffff,1); g.fillCircle(-10,40,60); g.fillCircle(-8,-35,42);
      g.fillStyle(0xd35400,1); g.fillTriangle(0,-35,0,-25,40,-30);
      g.fillStyle(0x2c3e50,1); g.fillCircle(-15,-45,6); g.fillCircle(15,-45,6);
    } else if (name === 'monster_ice_golem') {
      g.fillStyle(0x2980b9,1); g.fillRect(-70,-100,140,200);
      g.fillStyle(0x3498db,1); g.fillRect(-60,-90,120,180);
      g.fillStyle(0x00ffff,1); g.fillRect(-45,-70,25,25); g.fillRect(20,-70,25,25);
      g.lineStyle(2,0xffffff,0.5); g.lineBetween(-30,10,20,50); g.lineBetween(40,-20,60,20);
    } else if (name === 'monster_polar_bear') {
      g.fillStyle(0xdcdde1,1); g.fillEllipse(0,0,160,110); g.fillCircle(90,-40,50);
      g.fillStyle(0xffffff,1); g.fillEllipse(-10,-5,140,90);
      g.fillStyle(0x2f3640,1); g.fillCircle(115,-45,6); g.fillCircle(130,-35,10);
    } else if (name === 'monster_lollipop') {
      g.fillStyle(0xffffff,1); g.fillRect(-7,0,14,120);
      g.fillStyle(0xff4444,1); for (let i=0;i<5;i++) g.fillRect(-7,i*24,14,12);
      g.fillStyle(0xff69b4,1); g.fillCircle(0,-60,70);
      g.lineStyle(7,0xffffff,0.8); g.beginPath();
      for (let a=0;a<Math.PI*2.5;a+=0.15) { const r=a*9,px=Math.cos(a)*r,py=Math.sin(a)*r-60; if(a===0) g.moveTo(px,py); else g.lineTo(px,py); }
      g.strokePath();
      g.fillStyle(0x2c3e50,1); g.fillCircle(-22,-72,7); g.fillCircle(22,-72,7);
      g.lineStyle(5,0x2c3e50,1); g.beginPath(); g.arc(0,-55,18,0.2,Math.PI-0.2,false); g.strokePath();
    } else if (name === 'monster_teddy') {
      g.fillStyle(0xff6644,1); g.fillEllipse(0,30,110,130); g.fillCircle(0,-50,55);
      g.fillStyle(0xff9977,0.5); g.fillCircle(-18,-65,20);
      g.fillStyle(0xff6644,1); g.fillCircle(-38,-95,18); g.fillCircle(38,-95,18);
      g.fillStyle(0x2c3e50,1); g.fillCircle(-18,-55,7); g.fillCircle(18,-55,7);
      g.fillStyle(0xffffff,1); g.fillCircle(-20,-57,3); g.fillCircle(16,-57,3);
      g.lineStyle(4,0x2c3e50,1); g.beginPath(); g.arc(0,-40,16,0.2,Math.PI-0.2,false); g.strokePath();
    } else if (name === 'monster_candy_cane') {
      g.fillStyle(0xffffff,1); g.fillRect(-18,-60,36,160);
      g.fillStyle(0xdd1111,1); for (let i=0;i<6;i++) g.fillRect(-18,-60+i*27,36,13);
      g.fillStyle(0xffffff,1); g.fillRect(-18,-88,70,30); g.fillRect(34,-88,36,60);
      g.fillStyle(0xdd1111,1); g.fillRect(-18,-88,70,13); g.fillRect(34,-88,36,13); g.fillRect(34,-62,36,13);
      g.fillStyle(0x2c3e50,1); g.fillCircle(-6,40,5); g.fillCircle(6,40,5);
      g.lineStyle(4,0x2c3e50,1); g.beginPath(); g.arc(0,55,10,0.2,Math.PI-0.2,false); g.strokePath();
    } else if (name === 'monster_bee') {
      g.fillStyle(0xffd700,1); g.fillEllipse(0,20,80,120);
      g.fillStyle(0x1a1a1a,1); g.fillRect(-40,0,80,18); g.fillRect(-40,36,80,18); g.fillRect(-40,72,80,18);
      g.fillStyle(0xaaddff,0.55); g.fillEllipse(-65,-30,80,50); g.fillEllipse(65,-30,80,50);
